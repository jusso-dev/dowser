name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: swift test

      - name: Build universal binary
        run: ./scripts/build-universal.sh dist

      - name: Smoke test
        run: |
          ./dist/findphone --help
          ./dist/findphone --list

      - name: Reject invalid usage
        run: |
          if ./dist/findphone --bogus >/dev/null 2>&1; then
            echo "expected a non-zero exit for an unknown flag"; exit 1
          fi
          ./dist/findphone --bogus 2>&1 | grep -q "unknown option '--bogus'"
          ./dist/findphone one two 2>&1 | grep -q "expected one device name"
          ./dist/findphone --sound 2>&1 | grep -q "needs a device name"
          test -z "$(./dist/findphone --bogus 2>/dev/null)"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: findphone-macos-universal
          path: dist/findphone
          if-no-files-found: error

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      # Unsigned: the point is that the shared core still compiles for iOS,
      # which is where it silently rots.
      - name: Build the app
        run: |
          cd App
          xcodegen generate
          xcodebuild -project Dowser.xcodeproj -scheme Dowser \
            -destination 'generic/platform=iOS' -configuration Release \
            build CODE_SIGNING_ALLOWED=NO

      # The UI tests drive the app with -demo, so they need no radio.
      - name: UI tests
        run: |
          cd App
          xcodebuild test -project Dowser.xcodeproj -scheme Dowser \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
