name: Dowser
options:
  bundleIdPrefix: dev.jusso.dowser
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  FindPhoneKit:
    path: ..

targets:
  Dowser:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    dependencies:
      - package: FindPhoneKit
        product: FindPhoneKit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Dowser
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [bluetooth-le]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Shown in the permission prompt, so it says what the scan is for.
        NSBluetoothAlwaysUsageDescription:
          Dowser measures the Bluetooth signal strength of nearby devices so you
          can walk towards the one you are looking for.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jusso.dowser
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Runs against `-demo`, so it needs no Bluetooth radio and passes in a
  # simulator.
  DowserUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Dowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jusso.dowser.uitests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Dowser:
    build:
      targets:
        Dowser: all
        DowserUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [DowserUITests]
